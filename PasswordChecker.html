<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        let password=prompt("Enter Password:");
        if(password.length===0 || password.length<8)
    {
        document.write("Weak Password");
    }
    else
    {
        document.write("Strong Password");
    }
    </script>
</body>
