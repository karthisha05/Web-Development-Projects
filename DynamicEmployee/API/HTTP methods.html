<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h2 id="output">HTTP Method :</h2>
    <button onclick="showMethod('GET')">GET</button>
    <button onclick="showMethod('POST')">POST</button>
    <button onclick="showMethod('PUT')">PUT</button>
    <button onclick="showMethod('DELETE')">DELETE</button>
    <script>
        function showMethod(method)
        {
            document.getElementById("output").textContent="HTTP method:"+method;
        }
    </script>
</body>
</html>
