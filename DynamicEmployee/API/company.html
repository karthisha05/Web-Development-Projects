<!DOCTYPE html>
<html>
<head>
    <title>Users API</title>
</head>

<body>

    <h2>Users Details</h2>
    <button onclick="loadUsers()">Load Users</button>
    <pre id="output"></pre>
    <script>
        function loadUsers() 
        {
            let cp = new XMLHttpRequest();
            cp.open("GET","https://jsonplaceholder.typicode.com/users",true);
            cp.onreadystatechange = function () 
            {
                if (cp.readyState === 4)
                 {
                    if (cp.status === 200) 
                    {
                        document.getElementById("output").textContent =cp.responseText;
                    } 
                    else
                     {
                        document.getElementById("output").textContent = "Error loading users";
                    }
                }
            };
            cp.send();
        }
    </script>
</body>
</html>
